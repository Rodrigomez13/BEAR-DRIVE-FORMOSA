// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Navigation SDK 7.7+ requires AGP 8.13.2.
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin:secrets-gradle-plugin:2.0.1'

        // NOTE: Do not place application dependencies here; they belong
        // in the individual module build.gradle files.
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Navigation SDK already bundles the Maps SDK. Excluding the standalone
    // play-services-maps artifact prevents duplicate Maps classes at build time.
    configurations.configureEach {
        exclude group: 'com.google.android.gms', module: 'play-services-maps'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
